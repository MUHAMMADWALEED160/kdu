<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KDU Global | Unified Student & Admin Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ========================================================================
       TOP NAVIGATION BAR (ACTIVE ONCE LOGGED IN)
       ======================================================================== -->
  <header id="portalNavbar" class="portal-navbar hidden">
    <div class="nav-container">
      <div class="nav-brand-section">
        <button id="btnToggleSidebar" class="sidebar-toggle-btn" title="Toggle Navigation Sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <div class="brand-crest">KDU</div>
        <div class="brand-title-group">
          <h1>Kyungdong University Global</h1>
          <p id="topCurrentSystemTitle">Unified Campus Information System</p>
        </div>
      </div>

      <div class="nav-actions">
        <!-- User Identity Badge -->
        <div class="user-badge">
          <div class="user-badge-avatar" id="navUserAvatar">KD</div>
          <div class="user-badge-info">
            <span class="user-badge-name" id="navUserName">Loading...</span>
            <div class="user-badge-meta">
              <span id="navUserID">ID: ------</span>
              <span id="navUserRolePill" class="role-pill student">STUDENT</span>
            </div>
          </div>
        </div>

        <!-- Logout Button -->
        <button id="btnLogout" class="btn-logout" title="Sign out of portal">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>Sign Out</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ========================================================================
       AUTHENTICATION VIEW: DUAL ROLE (STUDENT & ADMIN)
       ======================================================================== -->
  <main id="authView" class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-crest brand-crest-lg">KDU</div>
        <h2>Kyungdong University Global</h2>
        <p class="auth-subtitle">Unified Student & Admin Campus Gateway</p>
        <div class="local-db-pill"><span></span>100% Local Database &bull; Zero External Server Required</div>
      </div>

      <div class="auth-nav-tabs">
        <button id="tabBtnLogin" class="auth-tab-btn active" type="button">Sign In</button>
        <button id="tabBtnSignup" class="auth-tab-btn" type="button">Register Student Account</button>
      </div>

      <div class="auth-body">
        <div id="authAlert" class="alert hidden" role="alert"></div>

        <!-- 1. LOGIN FORM -->
        <form id="loginForm">
          <div class="form-group">
            <label for="loginEmail">University Email <span class="required">*</span></label>
            <input type="email" id="loginEmail" class="form-control" placeholder="name@kduniv.ac.kr" required>
          </div>

          <div class="form-group">
            <label for="loginPassword">Portal Password <span class="required">*</span></label>
            <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn-primary btn-block">
            Sign In to Portal
          </button>

          <!-- 1-Click Quick Demo Accounts (Dual Role) -->
          <div class="demo-account-panel">
            <span>Instant 1-Click Demo Login:</span>
            <button type="button" id="btnQuickStudent" class="btn-demo-pill">
              👨‍🎓 Student Demo (Min-Jun Kim - CS)
            </button>
            <button type="button" id="btnQuickAdmin" class="btn-demo-pill admin-demo">
              🛡️ Admin Demo (Prof. David Park - Director)
            </button>
          </div>
        </form>

        <!-- 2. SIGN UP FORM (DUAL-ROLE) -->
        <form id="signupForm" class="hidden">
          <!-- Sign up creates STUDENT accounts only. Admin accounts are created in db.js (seed data). -->
          <div class="form-group">
            <label for="signupFullName">Full Legal Name <span class="required">*</span></label>
            <input type="text" id="signupFullName" class="form-control" placeholder="e.g. Alex Morgan" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="signupIDNumber">Student / Staff ID <span class="required">*</span></label>
              <input type="text" id="signupIDNumber" class="form-control" placeholder="2026-KD8091" required>
            </div>
            <div class="form-group">
              <label for="signupSemester">Enrolled Term</label>
              <select id="signupSemester" class="form-control">
                <option value="Spring 2026">Spring 2026</option>
                <option value="Fall 2025">Fall 2025</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="signupDepartment">Academic Department / Office <span class="required">*</span></label>
            <select id="signupDepartment" class="form-control" required>
              <option value="Global Computing & AI">Global Computing & AI</option>
              <option value="Smart Software & Information Security">Smart Software & Information Security</option>
              <option value="Global Business Administration">Global Business Administration</option>
              <option value="Hotel & Tourism Management">Hotel & Tourism Management</option>
              <option value="International Studies & Diplomacy">International Studies & Diplomacy</option>
            </select>
          </div>

          <div class="form-group">
            <label for="signupEmail">Email Address <span class="required">*</span></label>
            <input type="email" id="signupEmail" class="form-control" placeholder="student@kduniv.ac.kr" required>
          </div>

          <div class="form-group">
            <label for="signupPassword">Password <span class="required">*</span></label>
            <input type="password" id="signupPassword" class="form-control" placeholder="Min. 6 characters" minlength="6" required>
          </div>

          <button type="submit" class="btn-primary btn-block">
            Create Account & Enter Portal
          </button>
        </form>
      </div>
    </div>
  </main>

  <!-- ========================================================================
       PROTECTED DASHBOARD: 10 MODULES IN UNIFIED SIDEBAR LAYOUT
       ======================================================================== -->
  <div id="dashboardView" class="portal-layout hidden">
    
    <!-- LEFT SIDEBAR: 10 MODULE TABS -->
    <aside id="portalSidebar" class="portal-sidebar">
      <div class="sidebar-nav-header">Campus Systems</div>
      <ul class="sidebar-nav-list">
        <li class="sidebar-nav-item">
          <button type="button" class="sidebar-nav-btn active" data-module="notices">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            <span class="nav-label">1. University Info & Notices</span>
          </button>
        </li>
        <li class="sidebar-nav-item">
          <button type="button" class="sidebar-nav-btn" data-module="events">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            <span class="nav-label">2. Event Management</span>
          </button>
        </li>
        <li class="sidebar-nav-item">
          <button type="button" class="sidebar-nav-btn" data-module="library">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
            <span class="nav-label">3. Book Store & Library</span>
          </button>
        </li>
        <li class="sidebar-nav-item">
          <button type="button" class="sidebar-nav-btn" data-module="clubs">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            <span class="nav-label">4. Student Club Hub</span>
          </button>
        </li>
        <li class="sidebar-nav-item">
          <button type="button" class="sidebar-nav-btn" data-module="feedback">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            <span class="nav-label">5. Student Feedback & Ratings</span>
          </button>
        </li>
        <li class="sidebar-nav-item">
          <button type="button" class="sidebar-nav-btn" data-module="quizzes">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="9" y1="15" x2="15" y2="15"></line></svg>
            <span class="nav-label">6. Online Quiz System</span>
          </button>
        </li>
        <li class="sidebar-nav-item">
          <button type="button" class="sidebar-nav-btn" data-module="assignments">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
            <span class="nav-label">7. Assignment Submissions</span>
          </button>
        </li>
        <li class="sidebar-nav-item">
          <button type="button" class="sidebar-nav-btn" data-module="facilities">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect><line x1="9" y1="22" x2="9" y2="22.01"></line><line x1="15" y1="22" x2="15" y2="22.01"></line><line x1="8" y1="6" x2="8" y2="6.01"></line><line x1="16" y1="6" x2="16" y2="6.01"></line><line x1="8" y1="10" x2="8" y2="10.01"></line><line x1="16" y1="10" x2="16" y2="10.01"></line><line x1="8" y1="14" x2="8" y2="14.01"></line><line x1="16" y1="14" x2="16" y2="14.01"></line></svg>
            <span class="nav-label">8. Facility Booking</span>
          </button>
        </li>
        <li class="sidebar-nav-item">
          <button type="button" class="sidebar-nav-btn" data-module="media">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line><line x1="2" y1="7" x2="7" y2="7"></line><line x1="2" y1="17" x2="7" y2="17"></line><line x1="17" y1="17" x2="22" y2="17"></line><line x1="17" y1="7" x2="22" y2="7"></line></svg>
            <span class="nav-label">9. Campus Media Hub</span>
          </button>
        </li>
        <li class="sidebar-nav-item">
          <button type="button" class="sidebar-nav-btn" data-module="counseling">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
            <span class="nav-label">10. Student Counseling</span>
          </button>
        </li>
      </ul>
      <div class="sidebar-footer">
        <button id="btnSidebarResetData" class="btn-link-small">
          🔄 Reset Demo DB
        </button>
      </div>
    </aside>

    <!-- MAIN DYNAMIC CONTENT CONTAINER -->
    <main id="portalContent" class="portal-content">
      <!-- Active module rendered here dynamically by app.js -->
    </main>
  </div>

  <!-- ========================================================================
       MODAL CONTAINERS (DYNAMIC & POPULATED BY APP.JS)
       ======================================================================== -->
  <div id="activeModalBackdrop" class="modal-backdrop hidden">
    <div class="modal-content" id="activeModalContent">
      <!-- Injected dynamically -->
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" aria-live="polite"></div>

  <!-- Local Database Engine & Application Logic -->
  <script src="db.js"></script>
  <script src="app.js"></script>

</body>
</html>
